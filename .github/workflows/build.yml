name: Build Mutiny

# Builds the iPhone (.ipa), Android (.apk) and Windows (.zip) apps.
# Runs on every push to main, or by hand from the Actions tab.
# Push a tag like v1.0.0 to also publish a GitHub Release with all three files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  ios:
    name: iPhone (.ipa, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Mutiny-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-iOS
          path: Mutiny-iOS.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Mutiny-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-Android
          path: Mutiny-Android.apk

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Mutiny-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-Windows
          path: Mutiny-Windows.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Mutiny-iOS.ipa
            Mutiny-Android.apk
            Mutiny-Windows.zip
