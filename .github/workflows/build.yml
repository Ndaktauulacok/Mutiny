name: Build Mutiny

# Every push to main:
#   1. builds the iPhone (.ipa), Android (.apk) and Windows (.zip) apps,
#      versioned 1.0.<run number>;
#   2. publishes them as a GitHub Release, which Mutiny checks for updates.
# Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, in push order, so releases come out in order and the
# newest one is always marked "latest".
concurrency:
  group: mutiny-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.1"
  BUILD_ARGS: --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

jobs:
  ios:
    name: iPhone (.ipa, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app (no code signing)
        run: flutter build ios --release --no-codesign ${{ env.BUILD_ARGS }}
      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Mutiny-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-iOS
          path: Mutiny-iOS.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      # Repo secrets (Settings → Secrets and variables → Actions).
      # With them every APK has the same signature, so it installs as an update.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mutiny-release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=mutiny\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$RUNNER_TEMP/mutiny-release.jks" > android/key.properties
      - name: Warn when the signing key is missing
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set, APK is signed with a temporary debug key and won't update older installs."
      - run: flutter pub get
      - run: flutter build apk --release ${{ env.BUILD_ARGS }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Mutiny-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-Android
          path: Mutiny-Android.apk

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.BUILD_ARGS }}
      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Mutiny-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mutiny-Windows
          path: Mutiny-Windows.zip

  release:
    name: Publish release
    needs: [ios, android, windows]
    # Publish even if one platform failed (e.g. GitHub had no free Mac),
    # as long as Android built, so the in-app updater still gets the update.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mutiny 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: ${{ github.event.head_commit.message || 'New Mutiny build' }}
          fail_on_unmatched_files: false
          files: |
            Mutiny-iOS.ipa
            Mutiny-Android.apk
            Mutiny-Windows.zip
